name: test

on: [push, pull_request]

jobs:
  sanity:
    # Everything must parse, and the one stand-in that can be checked without a
    # GPU is actually run. The SDPA stand-in is exercised implicitly by every
    # generation, and the rasterizer stand-in needs torch, so both are verified
    # on the machine instead (tests/test_raster.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall runners tools tests
      - run: pip install numpy
      # The UV hole-filler replaces a C++ extension, so its behaviour is pinned
      # here. It needs numpy and nothing else.
      - run: python tests/test_inpaint.py
      # The step counter has no dependencies at all, and a wrong count is
      # worse than no count, so it is checked on every push.
      - run: python tests/test_steps.py
      # **What this runner reports, checked against the contract.** The model
      # is replaced by a stand-in, so this needs no GPU, no weights and nothing
      # installed - which is the point: a result key that quietly changes name
      # is not an error anywhere downstream, it just loses the settings.
      - run: python tests/test_result_shape.py
